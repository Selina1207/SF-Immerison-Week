name = "patient-rights-analyzer"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Set secrets with:
#   wrangler secret put NVIDIA_API_KEY
#   wrangler secret put SUPABASE_SERVICE_KEY
# Then deploy with: wrangler deploy

[vars]
SUPABASE_URL = "https://wljsozvipckmojqitunh.supabase.co"

[ai]
binding = "AI"

[assets]
directory = "./frontend"
binding = "ASSETS"

# Per-visitor cap on analyses so one person can't burn through the AI credits.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
